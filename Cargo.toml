[package]
name = "phantom"
version = "0.1.0"
edition = "2021"
description = "A CHIP-8 CPU emulator in Rust with a fully unit-tested core"
license = "MIT"

[[bin]]
name = "phantom"
path = "src/main.rs"

[lib]
name = "phantom"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.8"
